<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文文档中译工具（DeepSeek）</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b2f;
      --card-2: #1c2542;
      --text: #eaf0ff;
      --muted: #9db0dd;
      --accent: #70b8ff;
      --accent-2: #86efac;
      --danger: #fca5a5;
      --highlight: rgba(112, 184, 255, 0.3);
      --border: rgba(157, 176, 221, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #152042 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: min(1200px, calc(100% - 2rem));
      margin: 1.2rem auto 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .title {
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      margin: 0;
    }

    .muted { color: var(--muted); font-size: 0.9rem; }

    .api-key-box {
      margin-left: auto;
      background: rgba(28, 37, 66, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem;
      min-width: min(460px, 100%);
    }

    .api-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="password"], input[type="text"], textarea {
      width: 100%;
      background: #0f1630;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.7rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(112, 184, 255, 0.2);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0.58rem 0.9rem;
      color: #051022;
      background: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls {
      background: rgba(21, 27, 47, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-left: auto;
    }

    .progress-wrap {
      display: grid;
      gap: 0.4rem;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 0.8rem;
    }

    .progress-card {
      background: rgba(21, 27, 47, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .bar {
      width: 100%;
      height: 8px;
      background: #0f1630;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.4rem;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.12s linear;
    }

    .panes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    .pane {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(21, 27, 47, 0.93);
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-head {
      display: flex;
      justify-content: space-between;
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid var(--border);
      background: rgba(28, 37, 66, 0.95);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .pane-content {
      padding: 0.8rem;
      overflow: auto;
      height: calc(65vh - 42px);
      line-height: 1.65;
      scrollbar-gutter: stable;
    }

    .segment {
      margin: 0 0 0.6rem;
      padding: 0.35rem 0.45rem;
      border-radius: 8px;
      border: 1px solid transparent;
      white-space: pre-wrap;
    }

    .segment:hover {
      border-color: var(--border);
      cursor: pointer;
    }

    .segment.highlight {
      background: var(--highlight);
      border-color: rgba(112, 184, 255, 0.7);
    }

    .error { color: var(--danger); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 10;
    }

    .modal.show { display: flex; }

    .modal-card {
      width: min(520px, 100%);
      background: #101833;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    @media (max-width: 960px) {
      .panes { grid-template-columns: 1fr; }
      .api-key-box { min-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1 class="title">英文文档 → 中文翻译工具（DeepSeek）</h1>
        <div class="muted">上传英文文档后，左侧显示英文，右侧显示中文；滚动与段落高亮联动。</div>
      </div>

      <section class="api-key-box" aria-label="API Key">
        <div class="muted" style="margin-bottom:0.45rem;">右上角填写 DeepSeek API Key（首次使用也会弹窗提示）</div>
        <div class="api-row">
          <input id="apiKeyInput" type="password" placeholder="输入 sk-..." autocomplete="off" />
          <button id="saveKeyBtn" type="button">保存 Key</button>
          <button id="clearKeyBtn" type="button" class="secondary">清除</button>
        </div>
      </section>
    </header>

    <section class="controls">
      <input id="fileInput" type="file" accept=".txt,.md,.text" />
      <button id="translateBtn" type="button" disabled>上传后翻译</button>
      <span id="status" class="status">等待上传英文文档…</span>
    </section>

    <section class="progress-wrap">
      <div class="progress-card">左侧英文进度：<span id="leftPct">0%</span><div class="bar"><span id="leftBar"></span></div></div>
      <div class="progress-card">右侧中文进度：<span id="rightPct">0%</span><div class="bar"><span id="rightBar"></span></div></div>
    </section>

    <section class="panes">
      <article class="pane">
        <div class="pane-head"><strong>English</strong><span class="muted" id="sourceCount">0 段</span></div>
        <div class="pane-content" id="sourcePane"></div>
      </article>
      <article class="pane">
        <div class="pane-head"><strong>中文</strong><span class="muted" id="targetCount">0 段</span></div>
        <div class="pane-content" id="targetPane"></div>
      </article>
    </section>
  </main>

  <div class="modal" id="keyModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle" style="margin-top:0;">首次使用：请输入 DeepSeek API Key</h2>
      <p class="muted">Key 仅保存在浏览器 localStorage。你也可以在右上角随时修改。</p>
      <input id="modalApiKeyInput" type="password" placeholder="sk-..." autocomplete="off" />
      <div style="margin-top:0.8rem; display:flex; gap:0.5rem; justify-content:flex-end;">
        <button id="modalSaveBtn" type="button">保存并继续</button>
      </div>
    </div>
  </div>

  <script>
    const STORE_KEY = 'deepseek_api_key';
    const sourcePane = document.getElementById('sourcePane');
    const targetPane = document.getElementById('targetPane');
    const sourceCount = document.getElementById('sourceCount');
    const targetCount = document.getElementById('targetCount');
    const fileInput = document.getElementById('fileInput');
    const translateBtn = document.getElementById('translateBtn');
    const statusEl = document.getElementById('status');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const clearKeyBtn = document.getElementById('clearKeyBtn');
    const keyModal = document.getElementById('keyModal');
    const modalApiKeyInput = document.getElementById('modalApiKeyInput');
    const modalSaveBtn = document.getElementById('modalSaveBtn');
    const leftPct = document.getElementById('leftPct');
    const rightPct = document.getElementById('rightPct');
    const leftBar = document.getElementById('leftBar');
    const rightBar = document.getElementById('rightBar');

    let segments = [];
    let translatedSegments = [];
    let syncing = false;

    function getApiKey() {
      return localStorage.getItem(STORE_KEY) || '';
    }

    function setApiKey(key) {
      localStorage.setItem(STORE_KEY, key.trim());
      apiKeyInput.value = key.trim();
    }

    function requireApiKey() {
      if (!getApiKey()) {
        keyModal.classList.add('show');
      }
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
    }

    function splitSegments(text) {
      return text
        .replace(/\r\n/g, '\n')
        .split(/\n{2,}/)
        .map((v) => v.trim())
        .filter(Boolean);
    }

    function renderPane(pane, items, lang) {
      pane.innerHTML = '';
      items.forEach((txt, i) => {
        const div = document.createElement('div');
        div.className = 'segment';
        div.dataset.index = i;
        div.dataset.lang = lang;
        div.textContent = txt;
        pane.appendChild(div);
      });
    }

    function highlightByIndex(index) {
      document.querySelectorAll('.segment.highlight').forEach((n) => n.classList.remove('highlight'));
      document.querySelectorAll(`.segment[data-index="${index}"]`).forEach((n) => n.classList.add('highlight'));
    }

    function bindHighlight() {
      [sourcePane, targetPane].forEach((pane) => {
        pane.addEventListener('click', (e) => {
          const block = e.target.closest('.segment');
          if (!block) return;
          highlightByIndex(block.dataset.index);
        });

        pane.addEventListener('mouseup', () => {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed) return;
          const anchor = sel.anchorNode?.parentElement?.closest('.segment');
          if (anchor) {
            highlightByIndex(anchor.dataset.index);
          }
        });
      });
    }

    function getScrollProgress(el) {
      const max = el.scrollHeight - el.clientHeight;
      if (max <= 0) return 0;
      return (el.scrollTop / max) * 100;
    }

    function setProgress(left, right) {
      leftPct.textContent = `${left.toFixed(1)}%`;
      rightPct.textContent = `${right.toFixed(1)}%`;
      leftBar.style.width = `${left}%`;
      rightBar.style.width = `${right}%`;
    }

    function syncScroll(source, target) {
      if (syncing) return;
      syncing = true;
      const maxSource = source.scrollHeight - source.clientHeight;
      const ratio = maxSource > 0 ? source.scrollTop / maxSource : 0;
      const maxTarget = target.scrollHeight - target.clientHeight;
      target.scrollTop = ratio * Math.max(maxTarget, 0);
      setProgress(getScrollProgress(sourcePane), getScrollProgress(targetPane));
      requestAnimationFrame(() => { syncing = false; });
    }

    async function translateParagraph(apiKey, paragraph, idx, total) {
      setStatus(`翻译中 ${idx + 1}/${total} 段…`);
      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          temperature: 0.2,
          messages: [
            {
              role: 'system',
              content: '你是专业英文到中文翻译助手。仅输出中文译文，不要解释。保留原段落语气与结构。'
            },
            {
              role: 'user',
              content: paragraph
            }
          ]
        })
      });

      if (!response.ok) {
        const err = await response.text();
        throw new Error(`DeepSeek 请求失败（${response.status}）：${err.slice(0, 160)}`);
      }
      const data = await response.json();
      const text = data?.choices?.[0]?.message?.content?.trim();
      if (!text) throw new Error('DeepSeek 返回为空。');
      return text;
    }

    async function translateAll() {
      const apiKey = getApiKey();
      if (!apiKey) {
        requireApiKey();
        setStatus('请先填写 API Key。', true);
        return;
      }
      if (!segments.length) {
        setStatus('请先上传英文文档。', true);
        return;
      }

      translateBtn.disabled = true;
      translatedSegments = [];
      try {
        for (let i = 0; i < segments.length; i += 1) {
          const zh = await translateParagraph(apiKey, segments[i], i, segments.length);
          translatedSegments.push(zh);
          renderPane(targetPane, translatedSegments, 'zh');
          targetCount.textContent = `${translatedSegments.length} 段`;
        }
        setStatus('翻译完成。可点击任一段落进行双侧高亮联动。');
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        translateBtn.disabled = false;
        setProgress(getScrollProgress(sourcePane), getScrollProgress(targetPane));
      }
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const txt = await file.text();
        segments = splitSegments(txt);
        renderPane(sourcePane, segments, 'en');
        sourceCount.textContent = `${segments.length} 段`;
        translatedSegments = [];
        targetPane.innerHTML = '';
        targetCount.textContent = '0 段';
        translateBtn.disabled = segments.length === 0;
        setStatus(segments.length ? '文档已上传，点击“上传后翻译”。' : '未解析到可翻译段落。', segments.length === 0);
        setProgress(0, 0);
      } catch (err) {
        setStatus(`读取文件失败：${err.message || String(err)}`, true);
      }
    });

    saveKeyBtn.addEventListener('click', () => {
      const v = apiKeyInput.value.trim();
      if (!v) {
        setStatus('API Key 不能为空。', true);
        return;
      }
      setApiKey(v);
      keyModal.classList.remove('show');
      setStatus('API Key 已保存。');
    });

    clearKeyBtn.addEventListener('click', () => {
      localStorage.removeItem(STORE_KEY);
      apiKeyInput.value = '';
      setStatus('API Key 已清除。', true);
      requireApiKey();
    });

    modalSaveBtn.addEventListener('click', () => {
      const v = modalApiKeyInput.value.trim();
      if (!v) {
        setStatus('请输入 API Key。', true);
        return;
      }
      setApiKey(v);
      modalApiKeyInput.value = '';
      keyModal.classList.remove('show');
      setStatus('API Key 已保存。');
    });

    translateBtn.addEventListener('click', translateAll);

    sourcePane.addEventListener('scroll', () => syncScroll(sourcePane, targetPane));
    targetPane.addEventListener('scroll', () => syncScroll(targetPane, sourcePane));

    apiKeyInput.value = getApiKey();
    bindHighlight();
    requireApiKey();
  </script>
</body>
</html>
